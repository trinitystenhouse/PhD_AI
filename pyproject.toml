[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phd-ai"
version = "0.1.0"
description = "LLM-assisted tooling for researching PhD supervisors and tailoring application materials."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
phd-ai = "phd_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

